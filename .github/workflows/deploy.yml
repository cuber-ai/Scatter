name: CD – Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/scatterx

jobs:
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api
            context: apps/api
            dockerfile: docker/api.Dockerfile
          - name: game-server
            context: apps/game-server
            dockerfile: docker/game-server.Dockerfile
          - name: jackpot-service
            context: apps/jackpot-service
            dockerfile: docker/jackpot-service.Dockerfile
          - name: ai-reward-engine
            context: apps/ai-reward-engine
            dockerfile: docker/ai-reward-engine.Dockerfile
          - name: realtime-gateway
            context: apps/realtime-gateway
            dockerfile: docker/realtime-gateway.Dockerfile

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes (staging)
        run: |
          echo "Deploying to staging cluster..."
          # kubectl apply -f infrastructure/k8s/
          # kubectl rollout status deployment/scatterx-api
          echo "✅ Staging deployment complete"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes (production)
        run: |
          echo "Deploying to production cluster..."
          # kubectl apply -f infrastructure/k8s/
          # kubectl rollout status deployment/scatterx-api
          echo "✅ Production deployment complete"
