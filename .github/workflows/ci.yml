name: CI – Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript / Node.js ─────────────────────────────────────────────────────
  ts-lint-test:
    name: TypeScript Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/scatterx_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only

  # ── Rust ──────────────────────────────────────────────────────────────────────
  rust-test:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game-server
      - name: Format check
        run: cargo fmt --check
        working-directory: apps/game-server
      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/game-server
      - name: Test
        run: cargo test
        working-directory: apps/game-server

  # ── Go ────────────────────────────────────────────────────────────────────────
  go-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/jackpot-service/go.sum
      - name: Build
        run: go build ./...
        working-directory: apps/jackpot-service
      - name: Test
        run: go test ./... -v
        working-directory: apps/jackpot-service
      - name: Vet
        run: go vet ./...
        working-directory: apps/jackpot-service

  # ── Python ───────────────────────────────────────────────────────────────────
  python-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-reward-engine/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff
        working-directory: apps/ai-reward-engine
      - name: Ruff lint
        run: ruff check app/
        working-directory: apps/ai-reward-engine
      - name: Test
        run: pytest tests/ -v
        working-directory: apps/ai-reward-engine
