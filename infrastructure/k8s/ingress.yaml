apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scatterx-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.scatterx.app
        - admin.scatterx.app
        - realtime.scatterx.app
      secretName: scatterx-tls
  rules:
    - host: api.scatterx.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scatterx-api
                port:
                  number: 80
    - host: admin.scatterx.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scatterx-admin
                port:
                  number: 80
    - host: realtime.scatterx.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scatterx-realtime-gateway
                port:
                  number: 80
