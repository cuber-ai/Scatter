apiVersion: apps/v1
kind: Deployment
metadata:
  name: scatterx-game-server
  labels:
    app: scatterx-game-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scatterx-game-server
  template:
    metadata:
      labels:
        app: scatterx-game-server
    spec:
      containers:
        - name: game-server
          image: ghcr.io/cuber-ai/scatterx-game-server:latest
          ports:
            - containerPort: 9001
          env:
            - name: GAME_SERVER_PORT
              value: "9001"
            - name: GAME_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scatterx-secrets
                  key: game-server-api-key
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: scatterx-game-server
spec:
  selector:
    app: scatterx-game-server
  ports:
    - port: 9001
      targetPort: 9001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scatterx-jackpot-service
  labels:
    app: scatterx-jackpot-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scatterx-jackpot-service
  template:
    metadata:
      labels:
        app: scatterx-jackpot-service
    spec:
      containers:
        - name: jackpot-service
          image: ghcr.io/cuber-ai/scatterx-jackpot-service:latest
          ports:
            - containerPort: 9000
          env:
            - name: JACKPOT_SERVICE_PORT
              value: "9000"
            - name: JACKPOT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scatterx-secrets
                  key: jackpot-service-api-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: scatterx-secrets
                  key: redis-url
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scatterx-jackpot-service
spec:
  selector:
    app: scatterx-jackpot-service
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
